version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: finance-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  app:
    build: .
    container_name: finance-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
    restart: unless-stopped